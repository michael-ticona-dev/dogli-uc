<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Publicación Exitosa!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de Estilo Moderno */
        :root {
            --color-exito: #4CAF50; /* Verde para el check */
            --color-primario: #5C6BC0; /* Azul/Morado de tus archivos */
            --color-blanco: #FFFFFF;
            --color-texto: #333333;
            --color-fondo: #f4f7f6;
            --borde-suave: 12px;
            --sombra-flotante: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* 1. Estilos Generales */
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-fondo);
        }

        /* 2. Contenedor Principal (Centrado) */
        .success-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 3. Estilos de la Animación del Check (Moderno y Llamativo) */
        .checkmark-svg {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            stroke-width: 4; /* Grosor de la línea */
            stroke: var(--color-blanco);
            stroke-miterlimit: 10;
            background-color: var(--color-exito);
            box-shadow: var(--sombra-flotante);
            margin: 0 auto;
            
            /* Animación de entrada */
            animation: scaleIn 0.4s ease-in-out;
        }

        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke: var(--color-exito);
            fill: none;
            /* Animación para dibujar el círculo */
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.5s forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            /* Animación para dibujar el check */
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 1s forwards;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes stroke {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* 4. Estilos del Mensaje de Éxito */
        .success-title {
            color: var(--color-texto);
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 10px;
            animation: fadeIn 0.5s ease-out 1.5s forwards;
            opacity: 0; /* Oculto al inicio */
        }
        
        .success-subtitle {
            color: #777;
            font-size: 1.1rem;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out 1.7s forwards;
            opacity: 0; /* Oculto al inicio */
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }


        /* 5. Estilos del Botón (Moderno y Llamativo) */
        .success-button {
            display: inline-block;
            padding: 14px 40px;
            background-color: var(--color-primario);
            color: var(--color-blanco);
            border-radius: 50px; /* Bordes super suavizados (forma de píldora) */
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(92, 107, 192, 0.4);
            transition: all 0.3s ease;
            
            animation: fadeIn 0.5s ease-out 2s forwards;
            opacity: 0; /* Oculto al inicio */
        }

        .success-button:hover {
            transform: translateY(-3px); /* Efecto de "flotar" */
            box-shadow: 0 10px 30px rgba(92, 107, 192, 0.6);
            background-color: #4a5a9e; /* Un poco más oscuro */
        }
    </style>
</head>
<body>

    <div class="success-container">
        
        <svg class="checkmark-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="checkmark-circle-bg" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>

        <h2 class="success-title">¡Listo!</h2>
        <p class="success-subtitle">Tu anuncio fue publicado exitosamente.</p>

        <a href="../Anuncios/Anuncios.html" class="success-button">
            Ver Anuncios
        </a>
        <a href="../Inicio/index.html" class="success-button" style="margin-top: 15px;">
            Volver a Inicio
        </a>

    </div>

    <script src="../backend/api_config.js"></script>
    <script src="script_pasos.js"></script>
    <script>
        // Guardar el anuncio completo cuando se carga esta página
        document.addEventListener('DOMContentLoaded', async function() {
            // Obtener datos temporales
            const datosTemp = obtenerDatosTemporales();
            
            if (Object.keys(datosTemp).length > 0) {
                // Formatear fecha para la API (formato YYYY-MM-DD)
                const fechaPerdidoEncontrado = new Date().toISOString().split('T')[0];
                
                // Crear objeto de anuncio completo
                const anuncio = {
                    accion: datosTemp.accion || 'perdido',
                    nombre_perro: datosTemp.nombre_perro || '',
                    raza: datosTemp.raza || '',
                    tamano: datosTemp.tamano || '',
                    color_principal: datosTemp.color_principal || '',
                    color_secundario: datosTemp.color_secundario || '',
                    pelo: datosTemp.pelo || '',
                    pelaje: datosTemp.pelaje || '',
                    orejas: datosTemp.orejas || '',
                    distrito: datosTemp.distrito || '',
                    calle: datosTemp.calle || '',
                    contexto: datosTemp.contexto || '',
                    contacto: datosTemp.contacto || '',
                    coordenadas: datosTemp.coordenadas || '',
                    imagen: datosTemp.imagen || '',
                    imagenNombre: datosTemp.imagenNombre || '',
                    plan: datosTemp.plan || 'gratis',
                    fechaPerdidoEncontrado: fechaPerdidoEncontrado
                };
                
                try {
                    // Guardar el anuncio en la base de datos
                    const anuncioId = await guardarAnuncioAPI(anuncio);
                    console.log('Anuncio guardado en MySQL con ID:', anuncioId);
                    
                    // Limpiar datos temporales después de guardar
                    limpiarDatosTemporales();
                } catch (error) {
                    console.error('Error al guardar anuncio:', error);
                    alert('Error al guardar el anuncio. Por favor, intenta de nuevo.');
                    
                    // Fallback: guardar en localStorage si falla la API
                    console.log('Guardando en localStorage como respaldo...');
                    const fechaPerdidoEncontradoFormatted = new Date().toLocaleDateString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });
                    anuncio.fechaPerdidoEncontrado = fechaPerdidoEncontradoFormatted;
                    guardarAnuncio(anuncio); // Función de localStorage (fallback)
                }
            }
        });
    </script>
</body>
</html>

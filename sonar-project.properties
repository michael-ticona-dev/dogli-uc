# --- Identidad del proyecto ---
sonar.projectKey=dogli-uc
sonar.projectName=dogli-uc
sonar.projectVersion=1.0

# --- Servidor SonarQube ---
sonar.host.url=http://localhost:9000

# --- Codificación ---
sonar.sourceEncoding=UTF-8

# --- Analizar TODO el código del repo ---
sonar.sources=.

# Excluir solo cosas que NO son código de negocio
sonar.exclusions=\
vendor/**, \
node_modules/**, \
storage/**, \
public/**, \
bootstrap/cache/**, \
*.log, \
**/dist/**, \
**/build/**, \
coverage/**, \
.git/**, \
.idea/**, \
.vscode/**

# --- Laravel / PHP (incluye Fortify, Pest, etc.) ---
# Sonar ya detecta PHP automáticamente, no hace falta forzar,
# pero si quieres dejarlo explícito:
# sonar.language=php

# --- Tests (Pest + tests JS) ---
sonar.tests=tests
sonar.test.inclusions=tests/**

# --- React 19 + TS + Vite + ESLint ---
# SonarJS y SonarTS analizan:
#   - .js, .jsx, .ts, .tsx
#   - tu código React, hooks, componentes, etc.
# No hace falta indicar nada especial para React 19 o Vite.
# Opcional: si tu código React está en un sitio concreto, podrías marcarlo:
# sonar.sources=.
# sonar.javascript.node.maxspace ayuda si el proyecto es grande
sonar.javascript.node.maxspace=8192